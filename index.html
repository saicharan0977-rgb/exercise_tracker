<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Exercise Tracker</title>
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #F3F4F6;
            --surface: #FFFFFF;
            --text: #1F2937;
            --text-light: #6B7280;
            --success: #10B981;
            --danger: #EF4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.5;
        }
        h1, h2, h3 { color: var(--text); }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .streak-badge {
            background-color: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .reset-btn {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s, color 0.2s;
        }
        .reset-btn:hover {
            background: var(--danger);
            color: white;
        }
        .card {
            background: var(--surface);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            border: none;
            background: #E5E7EB;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-light);
        }
        .tab.active {
            background: var(--primary);
            color: white;
        }
        .hidden { display: none; }
        
        /* Today's View */
        .exercise-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #E5E7EB;
            gap: 12px;
        }
        .exercise-item:last-child { border-bottom: none; }
        input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--success);
        }
        .completed {
            text-decoration: line-through;
            color: var(--text-light);
        }
        .empty-state {
            text-align: center;
            color: var(--text-light);
            padding: 20px;
        }

        /* Planner View */
        .planner-day {
            margin-bottom: 20px;
        }
        .planner-day h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            border-bottom: 2px solid var(--primary);
            display: inline-block;
        }
        .add-exercise {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
        }
        button.add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button.add-btn:hover { background: #4338CA; }
        .planner-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .planner-list li {
            display: flex;
            justify-content: space-between;
            background: #F9FAFB;
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 4px;
        }
        .delete-btn {
            color: var(--danger);
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏋️ Fitness Tracker</h1>
        <div class="header-controls">
            <div class="streak-badge">
                🔥 <span id="streak-counter">0 Weeks Streak</span>
            </div>
            <button class="reset-btn" onclick="resetStreak()">Reset Streak</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab" onclick="switchTab('today')">Today's Window</button>
        <button class="tab" onclick="switchTab('planner')">Weekly Planner</button>
    </div>

    <!-- TODAY'S WINDOW -->
    <div id="today-view" class="card">
        <h2 id="today-title">Today's Exercises</h2>
        <div id="today-exercises">
            <!-- Exercises populated by JavaScript -->
        </div>
    </div>

    <!-- WEEKLY PLANNER -->
    <div id="planner-view" class="card hidden">
        <h2>Assign Workouts</h2>
        <div id="planner-container">
            <!-- Planner populated by JavaScript -->
        </div>
    </div>

    <script>
        const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        
        // Data Structure
        let schedule = JSON.parse(localStorage.getItem('workoutSchedule')) || {
            Monday: [], Tuesday: [], Wednesday: [], Thursday: [], Friday: [], Saturday: [], Sunday: []
        };
        
        let history = JSON.parse(localStorage.getItem('workoutHistory')) || {};
        
        // Initialization
        const todayStr = new Date().toLocaleDateString();
        const currentDayName = daysOfWeek[new Date().getDay()];

        function init() {
            document.getElementById('today-title').innerText = `${currentDayName}'s Workout Window`;
            renderPlanner();
            renderToday();
            calculateStreak();
        }

        // Tab Switching
        function switchTab(tab) {
            document.getElementById('today-view').classList.add('hidden');
            document.getElementById('planner-view').classList.add('hidden');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            if (tab === 'today') {
                document.getElementById('today-view').classList.remove('hidden');
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                renderToday();
            } else {
                document.getElementById('planner-view').classList.remove('hidden');
                document.querySelector('.tab:nth-child(2)').classList.add('active');
            }
        }

        // Render Planner
        function renderPlanner() {
            const container = document.getElementById('planner-container');
            container.innerHTML = '';

            const orderedDays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

            orderedDays.forEach(day => {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'planner-day';
                
                let listHtml = schedule[day].map((ex, index) => 
                    `<li>${ex} <button class="delete-btn" onclick="removeExercise('${day}', ${index})">✕</button></li>`
                ).join('');

                dayDiv.innerHTML = `
                    <h3>${day}</h3>
                    <ul class="planner-list" id="list-${day}">${listHtml}</ul>
                    <div class="add-exercise">
                        <input type="text" id="input-${day}" placeholder="Add exercise (e.g., 3x10 Pushups)">
                        <button class="add-btn" onclick="addExercise('${day}')">Add</button>
                    </div>
                `;
                container.appendChild(dayDiv);
            });
        }

        // Add/Remove Exercises
        function addExercise(day) {
            const input = document.getElementById(`input-${day}`);
            const val = input.value.trim();
            if (val) {
                schedule[day].push(val);
                saveSchedule();
                renderPlanner();
            }
        }

        function removeExercise(day, index) {
            schedule[day].splice(index, 1);
            saveSchedule();
            renderPlanner();
        }

        function saveSchedule() {
            localStorage.setItem('workoutSchedule', JSON.stringify(schedule));
        }

        // Render Today's View
        function renderToday() {
            const container = document.getElementById('today-exercises');
            const todaysExercises = schedule[currentDayName];
            
            if (!history[todayStr]) {
                history[todayStr] = {};
            }

            if (todaysExercises.length === 0) {
                container.innerHTML = `<div class="empty-state">No exercises assigned for ${currentDayName}. Enjoy your rest day or add workouts in the Planner!</div>`;
                return;
            }

            let html = '';
            todaysExercises.forEach((ex) => {
                const isChecked = history[todayStr][ex] ? 'checked' : '';
                const textClass = isChecked ? 'completed' : '';
                html += `
                    <div class="exercise-item">
                        <input type="checkbox" onchange="toggleExercise('${ex}', this.checked)" ${isChecked}>
                        <span class="${textClass}">${ex}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Handle Checkboxes
        function toggleExercise(exerciseName, isCompleted) {
            history[todayStr][exerciseName] = isCompleted;
            localStorage.setItem('workoutHistory', JSON.stringify(history));
            renderToday();
            calculateStreak();
        }

        // Calculate Consistency Streak (Weeks)
        function calculateStreak() {
            let weeks = 0;
            let checkDate = new Date();
            
            while (true) {
                let workedOutThisWeek = false;
                for (let i = 0; i < 7; i++) {
                    const dateStr = checkDate.toLocaleDateString();
                    if (history[dateStr] && Object.values(history[dateStr]).includes(true)) {
                        workedOutThisWeek = true;
                        break;
                    }
                    checkDate.setDate(checkDate.getDate() - 1);
                }
                
                if (workedOutThisWeek) {
                    weeks++;
                } else {
                    break;
                }
            }

            document.getElementById('streak-counter').innerText = `${weeks} Week${weeks !== 1 ? 's' : ''} Streak`;
        }

        // Reset Streak Function
        function resetStreak() {
            if (confirm("Are you sure you want to reset your streak and clear your tracking history?")) {
                localStorage.removeItem('workoutHistory');
                history = {};
                renderToday();
                calculateStreak();
            }
        }

        // Start app
        init();
    </script>
</body>
</html>
